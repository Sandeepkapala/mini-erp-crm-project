services:
  # Backend Node/Express Web Service
  - type: web
    name: mini-erp-crm-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false # Set your Neon PSQL connection string in Render Dashboard
      - key: CORS_ORIGIN
        value: "*"

  # Frontend React Static Site
  - type: web
    name: mini-erp-crm-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false # Set to your deployed Render backend URL (e.g. https://mini-erp-crm-backend.onrender.com/api)

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mini_erp_crm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
  backend:
    image: node:22-alpine
    working_dir: /app
    volumes: ["./backend:/app"]
    command: sh -c "npm install && npm run seed && npm run dev"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/mini_erp_crm
      JWT_SECRET: docker-development-secret
      CORS_ORIGIN: http://localhost:5173
      PORT: 5000
    ports: ["5000:5000"]
    depends_on: [db]
volumes:
  pgdata:
